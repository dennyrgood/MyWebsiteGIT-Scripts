# upssched.conf for ChatWorkhorseUnix — installed to /etc/nut/upssched.conf
# Created: 2026-08-04 UTC
#
# CWHU is a VirtualBox VM running ON ChatWorkhorse (Windows), which is itself on
# UPS #2. So CWHU has no power of its own: when CWH goes down, CWHU dies with it,
# cleanly or otherwise.
#
# WHY 5 MINUTES AND NOT 10 (WBU's value):
#
#   CWHU must be fully down BEFORE its host shuts down. ChatWorkhorse's watchdog
#   (ups-watch.ps1) triggers at 8 minutes and then waits for the VM to reach
#   poweroff, so 5 minutes leaves a 3-minute margin for CWHU's own teardown before
#   the host even begins, plus the host's wait as a second line of defence.
#
#   The margin is not arbitrary: CWHU runs a warm-standby Immich stack with Postgres
#   in Docker (see restore_from_wbu.sh). Stopping that properly takes real time, and
#   a host shutdown landing mid-checkpoint is the exact failure this exists to avoid.
#
# CWHU shuts itself down rather than being driven entirely from the host, so that it
# still stops cleanly if the host's scheduled task is broken, misconfigured, or
# running as the wrong user — a genuine risk, since VirtualBox VMs are invisible to
# a task running as SYSTEM.

CMDSCRIPT /etc/nut/upssched-cmd

PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

AT ONBATT * START-TIMER  onbatt-shutdown 300
AT ONLINE * CANCEL-TIMER onbatt-shutdown

# START-TIMER and CANCEL-TIMER never invoke CMDSCRIPT — only expiry does. Without
# these, a correctly armed timer and a NOTIFYCMD that never fired look identical
# (both silent). Learned the hard way on WBU, 2026-08-04.
AT ONBATT * EXECUTE onbatt-notice
AT ONLINE * EXECUTE online-notice
AT COMMOK * EXECUTE commok-selftest
