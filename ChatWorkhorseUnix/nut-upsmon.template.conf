# upsmon.conf TEMPLATE for ChatWorkhorseUnix — installed to /etc/nut/upsmon.conf
# Created: 2026-08-04 UTC
#
# This is a template. __PASSWORD__ is substituted by setup-nut-client.sh at install
# time, so no credential appears in this repo (which, unlike fleet-configs, is not
# private).
#
# CWHU is a NUT CLIENT (secondary) of ups2 on WorkBenchUnix — the UPS that actually
# powers ChatWorkhorse, and therefore this VM. Not the NAS: UPS #1 carries ~30-50W of
# network gear and does not report low battery until 15%, while UPS #2 carries an AI
# flagship and two servers and drains far faster.
#
# ADDRESS: WBU's LAN address is used rather than its Tailscale one because it works
# whether this VM is bridged onto the LAN or behind VirtualBox NAT — outbound
# connections succeed either way — and it does not depend on Tailscale being up
# inside the guest.
#     WBU LAN:       192.168.178.242
#     WBU Tailscale: 100.105.10.123  (workbenchunix.tailb73767.ts.net)
#
# Account is `monslave`: read-only, cannot command a shutdown of the group. The
# master account stays on WBU alone.

MONITOR ups2@192.168.178.242 1 monslave __PASSWORD__ slave

MINSUPPLIES 1

# Same reasoning as WorkBenchUnix. CWHU runs a warm-standby Immich stack with
# Postgres in Docker Compose (restore_from_wbu.sh tears it down and replays the dump
# nightly), so a bare `shutdown -h now` gives Postgres only Compose's 10-second
# default and can SIGKILL it mid-checkpoint.
#
#   HOME=/root      the script derives its log dir from $HOME; systemd does not
#                   reliably export HOME to system services, and if unset the mkdir
#                   fails under `set -e`, killing the script BEFORE it powers off.
#   STOP_TIMEOUT=30 tighter than the interactive default of 60 — CWHU has a 3-minute
#                   margin before its host starts shutting down, not all night.
#   -y --force      nothing is attended during an outage, and the busy-check would
#                   otherwise refuse to run during the nightly restore.
SHUTDOWNCMD "HOME=/root STOP_TIMEOUT=30 /home/dhm/repos/scripts/clean.ubuntu.shutdown -y --force"

# EXEC is required. The default is SYSLOG only, and without it NOTIFYCMD is never
# called, the 5-minute timer never starts, and this VM waits for its host to pull the
# floor out from under it.
NOTIFYCMD /usr/sbin/upssched

NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC

POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15

# Present because upsmon expects it, but inert: cutting UPS output is disabled
# fleet-wide (see Section 8 of the UPS & NUT guide), and in any case a VM cannot
# command the UPS its host is plugged into.
POWERDOWNFLAG /etc/killpower

NOTIFYMSG ONLINE   "UPS %s: power restored"
NOTIFYMSG ONBATT   "UPS %s: running on battery"
NOTIFYMSG LOWBATT  "UPS %s: battery low - shutting down"
