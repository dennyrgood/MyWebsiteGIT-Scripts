# upsmon.conf TEMPLATE for WorkBenchUnix — installed to /etc/nut/upsmon.conf
# Created: 2026-08-04 UTC
#
# This is a template, not a live config. __PASSWORD__ is substituted by
# setup-nut-server.sh at install time with a password it generates locally, so no
# credential ever appears in this repo (which, unlike fleet-configs, is not private).
#
# WBU drives UPS #2 over USB and is the NUT PRIMARY for it. This replaced an
# earlier config that monitored ups0 on the NAS (UPS #1) as a secondary — that was
# a workaround for UPS #2 having no NUT server, and it was unsound: UPS #1 carries
# ~30-50W of network gear while UPS #2 carries an AI flagship and two servers, so
# UPS #2 drains far faster and UPS #1's low-battery signal could arrive long after
# UPS #2 was already flat. WBU now monitors the battery it actually runs on.

MONITOR ups2@localhost 1 upsmon __PASSWORD__ master

MINSUPPLIES 1

# Deliberately NOT "/sbin/shutdown -h now".
#
# WBU runs Immich under Docker Compose. immich_postgres sets STOPSIGNAL=SIGINT
# (Postgres fast shutdown) but declares no StopTimeout, so Compose's 10-second
# default applies — a checkpoint on a multi-GB database can outrun that, and Docker
# then SIGKILLs Postgres mid-write. A power failure is the case where that is most
# likely and least recoverable, so the stacks get stopped properly first.
#
#   HOME=/root      clean.ubuntu.shutdown derives its log dir from $HOME. systemd
#                   does not reliably export HOME to system services; if unset the
#                   path becomes "/.cache/...", mkdir fails, and `set -e` kills the
#                   script BEFORE it powers anything off. Explicit here.
#   STOP_TIMEOUT=30 Halved from the interactive default of 60. Worst case is that
#                   timeout multiplied by the container count, and on battery that
#                   budget is not free.
#   -y              No confirmation prompt. Nothing is attended during an outage.
#   --force         Override the busy-check. It refuses to run during an rsync or
#                   pg_dump, which is right interactively and backwards here:
#                   losing a backup run beats losing the box.
SHUTDOWNCMD "HOME=/root STOP_TIMEOUT=30 /home/dhm/repos/scripts/clean.ubuntu.shutdown -y --force"

# ---------------------------------------------------------------------------
# Ten-minute on-battery shutdown — see /etc/nut/upssched.conf
# ---------------------------------------------------------------------------
# EXEC is required on these flags. The default is SYSLOG only, and without EXEC
# the NOTIFYCMD below is never called, the timer never starts, and the box would
# sit on battery until the 15% backstop.
NOTIFYCMD /usr/sbin/upssched

NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
# COMMBAD/COMMOK fire when the link to upsd drops and returns. Both are wired to
# EXEC so that restarting upsd produces a real COMMBAD->COMMOK pair and exercises
# the whole notify path — the previous attempt used COMMOK alone on a fresh start,
# which never fires, so the path went untested.
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC

POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15

# upsmon touches this during a forced shutdown; the systemd shutdown hook then
# tells the UPS to cut its own output so everything restarts when mains return.
# setup-nut-server.sh DISABLES that hook, because ImageBeast and ChatWorkhorse are
# on this UPS but are not yet NUT clients — HOSTSYNC cannot see them, so cutting
# UPS output would kill them mid-run. Re-enable once they are real upsmon clients.
POWERDOWNFLAG /etc/killpower

NOTIFYMSG ONLINE   "UPS %s: power restored"
NOTIFYMSG ONBATT   "UPS %s: running on battery"
NOTIFYMSG LOWBATT  "UPS %s: battery low - shutting down"
