# ups.conf for WorkBenchUnix — installed to /etc/nut/ups.conf
# Created: 2026-08-04 UTC
#
# WBU drives UPS #2 (Green Cell PowerProof 1500VA/1050W) directly over USB, and
# serves it to the other machines on that UPS. The cable was moved here from
# ImageBeast on 2026-08-04.
#
# WHY WBU AND NOT IMAGEBEAST: Windows claims a UPS as a `HID UPS Battery` power
# device. For NUT to drive it you must replace that with a WinUSB/libusb driver,
# which removes Windows' native UPS handling — it is either/or on one USB
# connection. ImageBeast is also a workstation that gets rebooted and run hard,
# which makes it a poor host for the service two other machines depend on.
#
# DRIVER CHOICE IS NOT A GUESS: the NAS runs an identical UPS model on
# `nutdrv_qx` (Voltronic-QS subdriver), and WBU enumerates the same USB ID
# (0665:5161 Cypress Semiconductor USB to Serial) as the NAS reported.

maxretry = 3

[ups2]
    driver = nutdrv_qx
    port = auto
    # No '#' in this string. NUT's parser strips from '#' to end-of-line even
    # inside double quotes, so "UPS #2" produced:
    #   Parse error: /etc/nut/ups.conf:23: Unbalanced word due to unescaped # in quotes
    # The UPS still worked, but the value was mangled and upsd logged an error on
    # every start. Write it as "UPS 2".
    desc = "Green Cell PowerProof 1500VA - UPS 2 (WBU, ImageBeast, ChatWorkhorse)"

    # Mirrored from the NAS's working config for the identical model, deliberately.
    # These cheap Voltronic-protocol units report an unreliable low-battery flag;
    # `ignorelb` tells NUT to disregard it and derive LB from the charge threshold
    # below instead. Without this, a spurious LB flag would shut the box down
    # immediately and with no warning.
    #
    # Note that WBU's actual shutdown trigger is the 10-minute on-battery timer in
    # upssched.conf, not this threshold — 15% is the backstop, not the plan.
    ignorelb
    override.battery.charge.low = 15
