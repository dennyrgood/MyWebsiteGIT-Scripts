# upsd.conf for WorkBenchUnix — installed to /etc/nut/upsd.conf
# Created: 2026-08-04 UTC
#
# Listens on all interfaces so ImageBeast and ChatWorkhorse (both on UPS #2, both
# on the local LAN) can monitor the UPS that actually powers them.
#
# 0.0.0.0 rather than a fixed address: WBU's LAN address is DHCP, and binding to a
# specific IP would break silently on a lease change. The exposure is the local LAN
# either way — upsd is authenticated (see upsd.users) and read access to battery
# telemetry is not sensitive.
LISTEN 0.0.0.0 3493
