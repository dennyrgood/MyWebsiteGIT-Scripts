# WorkBenchUnix kernel crash-capture settings
# Staged 2026-07-23. Install to /etc/sysctl.d/ (see install commands below).
#
# Background: on 2026-07-23 an rcu_preempt stall wedged a single kernel task
# (PID 255512) for ~40 min. The kernel logged the stall every ~3 min but never
# panicked, so the box stayed frozen (DNS/SSH/docker execs all timed out) until
# a manual hard reset — which left NO stack trace (the PID died with the reset).
#
# These settings turn the next such stall into a captured panic that survives
# the reboot via pstore (/sys/fs/pstore is already mounted on this host), then
# auto-reboots. Net effect: a 40-min silent freeze becomes a ~30s self-recovery
# WITH a backtrace waiting in pstore.

# Panic the instant an RCU stall is detected (the exact failure mode from
# 2026-07-23), instead of logging repeatedly and hanging indefinitely.
kernel.panic_on_rcu_stall = 1

# After any panic, auto-reboot after 30s (0 = hang forever at the panic screen).
kernel.panic = 30
