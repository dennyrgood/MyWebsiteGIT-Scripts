# upssched.conf for WorkBenchUnix — installed to /etc/nut/upssched.conf
# Created: 2026-08-04 UTC
#
# WHY A TIMER AND NOT A BATTERY THRESHOLD
#
# WBU is powered by UPS #2 (shared with ImageBeast and ChatWorkhorse) but takes its
# NUT signal from UPS #1 (router, switch, NAS, Mac Mini), because UPS #2 is
# USB-connected to ImageBeast under Windows' native UPS handling and runs no NUT
# server.
#
# That proxy is sound for ONBATT — both units share the building supply and drop
# together. It is NOT sound for LOWBATT: UPS #1 carries ~30-50W of network gear,
# UPS #2 carries an AI flagship and two more servers. UPS #2 drains far faster, and
# the NAS declares `ignorelb` with `override.battery.charge.low = 15`, so its
# LOWBATT does not fire until 15%. UPS #2 could be flat long before that, leaving
# WBU to lose power mid-write — the exact failure the UPS exists to prevent.
#
# So: twenty minutes on battery is treated as "this outage is not brief, stand down".
# Elapsed time is the honest measure here. A charge percentage read from UPS #1
# tells us nothing reliable about the battery WBU is actually running on, whereas
# "the mains have been gone for ten minutes" is equally true for both units.
#
# upsmon still runs underneath this and handles comms loss (DEADTIME) and the real
# LOWBATT at 15%. Whichever fires first wins.

CMDSCRIPT /etc/nut/upssched-cmd

# /run/nut is created by the nut-client tmpfiles snippet, mode 0770 root:nut, so
# the unprivileged half of upsmon can write here.
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Ten minutes on battery -> shut down. CANCEL on ONLINE is not optional: without
# it, a brief flicker would still power the box off ten minutes later, long after
# the mains came back.
AT ONBATT * START-TIMER onbatt-shutdown 1200
AT ONLINE * CANCEL-TIMER onbatt-shutdown

# 2026-08-29: raised 600 -> 1200 after the first full-outage test measured the real
# discharge curve. The UPS reports 100% and collapses to ~75% within 35 seconds of
# going on battery - that drop is the unit recalculating under load, not capacity.
# From there it fell 75% -> 50% in 21.8 minutes, about 1.15%/min, and that was while
# load was DROPPING as machines shut down; at full fleet load it is somewhat faster.
# Real runtime is therefore roughly 45-65 minutes, so the original 10 minutes was
# spending under a fifth of it and shutting down for outages it could have ridden out.
#
# Twenty still leaves a wide margin, and widens the gap to the clients (5/8/8) from
# two minutes to twelve. That gap matters more than it looks: WBU is the NUT server,
# so once it powers off no client can arm a timer at all - a client timer that has not
# fired before WBU goes never fires. Every client MUST stay comfortably below this.
#
# Extrapolated from one partial-load discharge, not a measured full curve, and the
# bottom of a lead-acid curve is nonlinear. Ageing shrinks it too; the health monitor's
# UPS_REPLACE_BATTERY check is what guards against that.


# Observability, and not decoration. START-TIMER and CANCEL-TIMER never invoke
# CMDSCRIPT — only a timer that actually EXPIRES does. So a successful test looks
# exactly like a NOTIFYCMD that never fired: silence either way. Verified during the
# 2026-08-04 plug-pull test, where upsmon logged "running on battery" but nothing
# whatsoever appeared from upssched, leaving no way to tell whether the timer had
# started. These two lines log at the moment the timer starts and is cancelled, so
# the mechanism can be tested without waiting ten minutes for a real shutdown.
AT ONBATT * EXECUTE onbatt-notice
AT ONLINE * EXECUTE online-notice

# Fires once when upsmon establishes contact with upsd. Harmless in itself — it is
# here so that restarting nut-monitor exercises the whole NOTIFYCMD -> upssched ->
# CMDSCRIPT path and proves it works, without waiting for a real power cut.
AT COMMOK * EXECUTE commok-selftest
