# upssched.conf for WorkBenchUnix — installed to /etc/nut/upssched.conf
# Created: 2026-08-04 UTC
#
# WHY A TIMER AND NOT A BATTERY THRESHOLD
#
# WBU is powered by UPS #2 (shared with ImageBeast and ChatWorkhorse) but takes its
# NUT signal from UPS #1 (router, switch, NAS, Mac Mini), because UPS #2 is
# USB-connected to ImageBeast under Windows' native UPS handling and runs no NUT
# server.
#
# That proxy is sound for ONBATT — both units share the building supply and drop
# together. It is NOT sound for LOWBATT: UPS #1 carries ~30-50W of network gear,
# UPS #2 carries an AI flagship and two more servers. UPS #2 drains far faster, and
# the NAS declares `ignorelb` with `override.battery.charge.low = 15`, so its
# LOWBATT does not fire until 15%. UPS #2 could be flat long before that, leaving
# WBU to lose power mid-write — the exact failure the UPS exists to prevent.
#
# So: ten minutes on battery is treated as "this outage is not brief, stand down".
# Elapsed time is the honest measure here. A charge percentage read from UPS #1
# tells us nothing reliable about the battery WBU is actually running on, whereas
# "the mains have been gone for ten minutes" is equally true for both units.
#
# upsmon still runs underneath this and handles comms loss (DEADTIME) and the real
# LOWBATT at 15%. Whichever fires first wins.

CMDSCRIPT /etc/nut/upssched-cmd

# /run/nut is created by the nut-client tmpfiles snippet, mode 0770 root:nut, so
# the unprivileged half of upsmon can write here.
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Ten minutes on battery -> shut down. CANCEL on ONLINE is not optional: without
# it, a brief flicker would still power the box off ten minutes later, long after
# the mains came back.
AT ONBATT * START-TIMER onbatt-shutdown 600
AT ONLINE * CANCEL-TIMER onbatt-shutdown

# Fires once when upsmon establishes contact with upsd. Harmless in itself — it is
# here so that restarting nut-monitor exercises the whole NOTIFYCMD -> upssched ->
# CMDSCRIPT path and proves it works, without waiting for a real power cut.
AT COMMOK * EXECUTE commok-selftest
